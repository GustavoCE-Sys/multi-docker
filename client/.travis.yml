language: generic

sudo: required
services:
  - docker

before_install:
  - docker build -t gustavoce/react-test -f ./client/Dockerfile.dev ./client

script:
  - docker run -e CI=true gustavoce/react-test npm test

after_success:
  - docker build -t gustavoce/multi-client ./client
  - docker build -t gustavoce/multi-nginx ./nginx
  - docker build -t gustavoce/nulti-server ./server
  - docker build -t gustavoce/multi-worker ./worker